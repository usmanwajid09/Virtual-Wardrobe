<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - StyleIQ</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .auth-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(to right, rgba(10, 4, 6, 0.95), rgba(74, 13, 28, 0.6)), url('https://images.unsplash.com/photo-1550614000-4b95d4662d5a?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            padding: 50px;
            border-radius: 24px;
            width: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .auth-logo {
            font-family: var(--font-heading);
            font-size: 36px;
            color: #fff;
            margin-bottom: 8px;
        }
        .auth-logo span { color: var(--gold); }
        .auth-sub { color: var(--text-dim); margin-bottom: 40px; font-size: 15px;}
        
        .auth-form input {
            width: 100%;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            transition: 0.3s;
        }
        .auth-form input:focus { border-color: var(--burgundy-light); outline: none; background: rgba(255,255,255,0.1);}
        
        .btn-auth {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-auth:hover { background: #fff; transform: translateY(-2px);}
        
        .auth-link { display: block; margin-top: 24px; color: var(--text-dim); text-decoration: none; font-size: 14px;}
        .auth-link:hover { color: #fff;}
        .error-msg { color: #fca5a5; font-size: 14px; margin-bottom: 16px; display: none; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">Style<span>IQ</span></div>
        <p class="auth-sub">Create your premium fashion profile.</p>
        
        <div id="error-box" class="error-msg">Registration error.</div>
        
        <form class="auth-form" id="signup-form">
            <input type="text" id="username" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Create Password" required>
            <button type="submit" class="btn-auth">Create Account</button>
        </form>
        
        <a href="login.html" class="auth-link">Already have an account? Sign in.</a>
    </div>
</div>

<script>
document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
        const res = await fetch('/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });
        
        const data = await res.json();
        
        if (res.ok && data.token) {
            localStorage.setItem('styleiq_token', data.token);
            window.location.href = '/dashboard.html';
        } else {
            const errBox = document.getElementById('error-box');
            errBox.innerText = data.error || 'Registration failed.';
            errBox.style.display = 'block';
        }
    } catch (err) {
        console.error(err);
    }
});
</script>

</body>
</html>
